<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Plan · 8 meses</title>
<style>
  :root{
    --bg:#15171B;
    --surface:#1E2126;
    --surface2:#262A30;
    --border:#31363D;
    --text:#ECEAE6;
    --text-dim:#8B909A;
    --accent:#E0A73B;
    --accent-ink:#241804;
    --done:#5FAE93;
    --done-ink:#0B1F17;
    --warn-bg:#332415;
    --warn-text:#E0A73B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 14px 40px;
    max-width:460px;
    margin-left:auto;
    margin-right:auto;
  }
  .header{margin-bottom:14px;}
  .title{font-size:20px;font-weight:700;letter-spacing:-0.01em;margin:0 0 2px;}
  .subtitle{font-size:13px;color:var(--text-dim);margin:0;}
  .week-row{
    display:flex;align-items:center;gap:10px;margin-top:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;
  }
  .week-row label{font-size:13px;color:var(--text-dim);flex-shrink:0;}
  .week-row input{
    width:52px;background:var(--surface2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:6px 8px;font-size:15px;text-align:center;
  }
  .phase-badge{
    margin-left:auto;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;
    background:rgba(224,167,59,0.15);color:var(--accent);white-space:nowrap;
  }
  .phase-badge.deload{background:var(--warn-bg);color:var(--warn-text);}
  .phase-detail{font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.5;}
  .phase-note{font-size:12px;color:var(--accent);margin-top:6px;line-height:1.5;}

  .day-pills{
    display:flex;gap:6px;margin-top:18px;overflow-x:auto;padding-bottom:2px;
  }
  .day-pill{
    flex:1;min-width:42px;text-align:center;padding:10px 4px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    font-size:13px;font-weight:700;cursor:pointer;user-select:none;
  }
  .day-pill.rest{flex:1.4;font-size:11px;}
  .day-pill.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  .day-panel{
    margin-top:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:16px;
  }
  .day-title{font-size:17px;font-weight:700;margin:0 0 2px;}
  .day-focus{font-size:13px;color:var(--text-dim);margin:0 0 14px;}

  .progress-track{
    height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-bottom:16px;
  }
  .progress-fill{height:100%;background:var(--done);border-radius:4px;transition:width .25s ease;}
  .progress-label{font-size:12px;color:var(--text-dim);margin:6px 0 0;text-align:right;}

  .exercise{
    display:flex;align-items:flex-start;gap:12px;padding:12px 0;
    border-top:1px solid var(--border);
  }
  .exercise:first-of-type{border-top:none;padding-top:0;}
  .checkbox{
    width:24px;height:24px;flex-shrink:0;border-radius:50%;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;margin-top:1px;cursor:pointer;
    background:var(--surface2);
  }
  .checkbox.checked{background:var(--done);border-color:var(--done);}
  .checkbox svg{width:13px;height:13px;display:none;}
  .checkbox.checked svg{display:block;}
  .ex-name{font-size:14.5px;line-height:1.4;margin:0 0 2px;}
  .ex-name.checked{color:var(--text-dim);text-decoration:line-through;}
  .ex-meta{font-size:12.5px;color:var(--text-dim);}

  .rest-card{
    text-align:left;font-size:14px;color:var(--text-dim);line-height:1.6;
  }
  .rest-card strong{color:var(--text);}

  .reset-btn{
    margin-top:16px;width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text-dim);font-size:13px;cursor:pointer;
  }
  .reset-btn:active{background:var(--border);}
</style>
</head>
<body>

<div class="header">
  <p class="title">Plan de entrenamiento</p>
  <p class="subtitle">Volumen / hipertrofia · 8 meses</p>
  <div class="week-row">
    <label for="weekInput">Semana</label>
    <input type="number" id="weekInput" min="1" max="34" value="1">
    <span class="phase-badge" id="phaseBadge">M1</span>
  </div>
  <p class="phase-detail" id="phaseDetail"></p>
  <p class="phase-note" id="phaseNote" style="display:none;"></p>
</div>

<div class="day-pills" id="dayPills"></div>

<div class="day-panel" id="dayPanel"></div>

<button class="reset-btn" id="resetBtn">Reiniciar marcas de hoy</button>

<script>
const phases = [
  {id:'m1', label:'M1 · Acumulación', w:[1,8], series:'3-4', reps:'10-12', rpe:'7-8', rest:'60-90s', deload:false},
  {id:'d1', label:'Descarga', w:[9,9], series:'2', reps:'12-15', rpe:'5-6', rest:'—', deload:true},
  {id:'m2', label:'M2 · Volumen alto', w:[10,17], series:'4-5', reps:'8-12', rpe:'8-9', rest:'90-120s', deload:false},
  {id:'d2', label:'Descarga', w:[18,18], series:'2', reps:'12-15', rpe:'5-6', rest:'—', deload:true},
  {id:'m3', label:'M3 · Intensificación', w:[19,26], series:'4-5', reps:'6-10', rpe:'8-9', rest:'120-180s', deload:false},
  {id:'d3', label:'Descarga', w:[27,27], series:'2', reps:'12-15', rpe:'5-6', rest:'—', deload:true},
  {id:'m4', label:'M4 · Especialización', w:[28,34], series:'3-4', reps:'8-15', rpe:'8-9', rest:'variable',
   deload:false, note:'Añade rest-pause o series descendentes en la última serie de los ejercicios de aislamiento.'}
];

const days = [
  {id:'L', short:'L', name:'Lunes', focus:'Empuje — Pecho / Hombro / Tríceps', exercises:[
    'Press banca en máquina guiada (Smith)',
    'Press inclinado con mancuernas',
    'Apertura de pecho en máquina',
    'Press de hombro con mancuernas',
    'Elevaciones laterales en cable bajo',
    'Extensión de tríceps en polea alta',
    'Press francés con barra W'
  ]},
  {id:'M', short:'M', name:'Martes', focus:'Tracción — Espalda / Bíceps', exercises:[
    'Jalón al pecho en polea alta',
    'Remo en polea baja (agarre estrecho)',
    'Remo a una mano con mancuerna',
    'Apertura de hombro posterior en máquina',
    'Curl bíceps en banco Scott (barra W)',
    'Curl martillo con barra hammer',
    'Máquina de lumbares'
  ]},
  {id:'X', short:'X', name:'Miércoles', focus:'Pierna A — Cuádriceps / Glúteo', exercises:[
    'Máquina de sentadilla',
    'Prensa de pierna',
    'Extensión de cuádriceps',
    'Máquina de apertura de pierna (glúteo medio)',
    'Máquina de gemelos (pie recto)'
  ]},
  {id:'J', short:'J', name:'Jueves', focus:'Torso complementario', exercises:[
    'Press banca con mancuernas',
    'Remo en polea baja (agarre ancho)',
    'Press de hombro en máquina guiada',
    'Curl bíceps con mancuernas',
    'Extensión de tríceps en cable doble',
    'Apertura de pecho en máquina'
  ]},
  {id:'V', short:'V', name:'Viernes', focus:'Pierna B — Femoral / Glúteo / Gemelo + Core', exercises:[
    'Curl femoral (contracción)',
    'Prensa de pierna (pies altos)',
    'Máquina de apertura de pierna (aductor/abductor)',
    'Máquina de gemelos (pie en punta)',
    'Máquina de abdominales pies en alto',
    'Rueda de abdominales',
    'Máquina de lumbares'
  ]},
  {id:'R', short:'S-D', name:'Fin de semana', rest:true}
];

let currentDay = 'L';
let currentWeek = 1;
const today = new Date().toISOString().slice(0,10);

const storage = (typeof window.storage !== 'undefined') ? window.storage : {
  async get(key){
    try{
      const v = localStorage.getItem(key);
      return v === null ? null : {key, value:v};
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      localStorage.setItem(key, value);
      return {key, value};
    }catch(e){ return null; }
  }
};

function getPhase(week){
  for(const p of phases){ if(week >= p.w[0] && week <= p.w[1]) return p; }
  return phases[phases.length-1];
}

async function loadState(){
  try{
    const r = await storage.get('current-week');
    if(r && r.value) currentWeek = parseInt(r.value,10) || 1;
  }catch(e){}
  document.getElementById('weekInput').value = currentWeek;
}

async function saveWeek(week){
  try{ await storage.set('current-week', String(week)); }catch(e){}
}

async function getChecked(dayId){
  try{
    const r = await storage.get('checked:'+today+':'+dayId);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){}
  return [];
}

async function setChecked(dayId, arr){
  try{ await storage.set('checked:'+today+':'+dayId, JSON.stringify(arr)); }catch(e){}
}

function renderPills(){
  const wrap = document.getElementById('dayPills');
  wrap.innerHTML = '';
  days.forEach(d=>{
    const el = document.createElement('div');
    el.className = 'day-pill' + (d.id===currentDay?' active':'') + (d.rest?' rest':'');
    el.textContent = d.short;
    el.onclick = ()=>{ currentDay = d.id; renderPills(); renderDay(); };
    wrap.appendChild(el);
  });
}

function renderPhaseHeader(){
  const phase = getPhase(currentWeek);
  const badge = document.getElementById('phaseBadge');
  badge.textContent = phase.label;
  badge.className = 'phase-badge' + (phase.deload ? ' deload' : '');
  document.getElementById('phaseDetail').textContent =
    phase.series + ' series · ' + phase.reps + ' reps · RPE ' + phase.rpe + ' · descanso ' + phase.rest;
  const noteEl = document.getElementById('phaseNote');
  if(phase.note){ noteEl.style.display='block'; noteEl.textContent = phase.note; }
  else{ noteEl.style.display='none'; }
}

async function renderDay(){
  const panel = document.getElementById('dayPanel');
  const day = days.find(d=>d.id===currentDay);

  if(day.rest){
    panel.innerHTML =
      '<p class="day-title">Fin de semana</p>' +
      '<p class="day-focus">Descanso</p>' +
      '<div class="rest-card">' +
      '<strong>Descanso</strong> o cardio ligero opcional (20-30 min).<br><br>' +
      'Prioriza sueño y alimentación — es cuando se consolida el trabajo de la semana.' +
      '</div>';
    return;
  }

  const phase = getPhase(currentWeek);
  const checked = await getChecked(day.id);

  let html = '<p class="day-title">' + day.name + '</p>';
  html += '<p class="day-focus">' + day.focus + '</p>';
  html += '<div class="progress-track"><div class="progress-fill" id="progFill"></div></div>';
  html += '<div id="exList"></div>';
  panel.innerHTML = html;

  const list = document.getElementById('exList');
  day.exercises.forEach((name, idx)=>{
    const isChecked = checked.includes(idx);
    const row = document.createElement('div');
    row.className = 'exercise';
    row.innerHTML =
      '<div class="checkbox' + (isChecked?' checked':'') + '" data-idx="' + idx + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="' + 'var(--done-ink)' + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>' +
      '</div>' +
      '<div>' +
      '<p class="ex-name' + (isChecked?' checked':'') + '">' + name + '</p>' +
      '<p class="ex-meta">' + phase.series + '×' + phase.reps + ' · RPE ' + phase.rpe + ' · ' + phase.rest + '</p>' +
      '</div>';
    row.querySelector('.checkbox').onclick = async ()=>{
      const c = await getChecked(day.id);
      const i = c.indexOf(idx);
      if(i>-1) c.splice(i,1); else c.push(idx);
      await setChecked(day.id, c);
      renderDay();
    };
    list.appendChild(row);
  });

  const pct = day.exercises.length ? Math.round((checked.length/day.exercises.length)*100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
}

document.getElementById('weekInput').addEventListener('change', async (e)=>{
  let v = parseInt(e.target.value,10);
  if(isNaN(v)) v = 1;
  v = Math.max(1, Math.min(34, v));
  currentWeek = v;
  e.target.value = v;
  await saveWeek(v);
  renderPhaseHeader();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  await setChecked(currentDay, []);
  renderDay();
});

(async function init(){
  await loadState();
  renderPhaseHeader();
  renderPills();
  renderDay();
})();
</script>
</body>
</html>
